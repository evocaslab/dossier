# Brand source of truth for the repo dossier checker (name: dossier, decided 2026-11-24, hq#188).
# Mark and colours: the amber folder with a check, built and checked with brandforge (maintainer, hq#218, 2026-11-26).
# Masters hold light colours only; `brandforge build` writes the dark, mono, favicon and PNG files into generated/.
# The name lives in brand.config.json; texts below repeat it only where a sentence needs it.
schema: 1

languages:
  - {code: uk, label: Укр, name: Українська}
  - {code: en, label: Eng, name: English}
default_language: en

name:
  uk: Досьє
  en: dossier
tagline:
  uk: Репозиторій, що пояснює себе сам.
  en: A repo that can explain itself.
mission:
  uk: Кожен публічний репозиторій пояснює себе, і це перевіряє скрипт.
  en: Every public repo explains itself, and a script checks it.
vision:
  uk: Репозиторій без сторінки мети, причин чи дизайну не вважається завершеним.
  en: A repo with no purpose, reasons or design page is not called finished.

# One saturated primary (folder amber) and a contrast-tested pair in light and dark; neutrals shared with the
# sibling tools (folio, brandforge, svgward) so they look related.
roles:
  paper:          {light: "#F6F7FB", dark: "#111219", meaning: {uk: Тло сторінки, en: Page background}}
  surface:        {light: "#FFFFFF", dark: "#1A1C26", meaning: {uk: "Картки, поля", en: "Cards, inputs"}}
  surface-sunken: {light: "#E4E7F2", dark: "#262938", meaning: {uk: Заглиблена поверхня, en: Sunken surface}}
  ink:            {light: "#14151F", dark: "#ECEEF8", meaning: {uk: Основний текст, en: Body text}}
  muted:          {light: "#545868", dark: "#A9AEC4", meaning: {uk: Другорядний текст, en: Secondary text}}
  border-strong:  {light: "#7B7F92", dark: "#878CA3", meaning: {uk: Межі полів і елементів керування, en: Input and control borders}}
  primary:        {light: "#8A5A00", dark: "#F2B544", meaning: {uk: "Єдиний акцент: тека знака, кнопки", en: "The one accent: the mark's folder, buttons"}}
  folder-back:    {light: "#6B4500", dark: "#C98A1C", meaning: {uk: "Задня стінка теки в знаку", en: "The folder's back in the mark"}}
  sheet:          {light: "#FFFDF7", dark: "#ECEEF8", meaning: {uk: "Аркуш у теці знака", en: "The sheet inside the mark's folder"}}
  on-primary:     {light: "#FEFEFE", dark: "#231800", meaning: {uk: Текст і галочка на акценті, en: Text and the check mark on the accent}}
  primary-text:   {light: "#6E4700", dark: "#F8CF7A", meaning: {uk: "Посилання й підписи акцентом", en: "Links and accent labels"}}
  focus:          {light: "#14151E", dark: "#EDEFF8", meaning: {uk: Рамка фокуса клавіатури, en: Keyboard focus ring}}

pairs:
  - {fg: ink, bg: paper, kind: text, level: aaa, use: Body text on the page}
  - {fg: ink, bg: surface, kind: text, level: aa, use: Body text on a card}
  - {fg: ink, bg: surface-sunken, kind: text, level: aa, use: Body text on a sunken area}
  - {fg: muted, bg: paper, kind: text, level: aa, use: Secondary text on the page}
  - {fg: muted, bg: surface, kind: text, level: aa, use: Secondary text on a card}
  - {fg: primary-text, bg: paper, kind: text, level: aa, use: Link on the page}
  - {fg: primary-text, bg: surface, kind: text, level: aa, use: Link on a card}
  - {fg: on-primary, bg: primary, kind: text, level: aa, use: Button label on the accent}
  - {fg: border-strong, bg: paper, kind: ui, level: aa, use: Input border on the page}
  - {fg: border-strong, bg: surface, kind: ui, level: aa, use: Input border on a card}
  - {fg: focus, bg: paper, kind: ui, level: aa, use: Focus ring on the page}
  - {fg: focus, bg: surface, kind: ui, level: aa, use: Focus ring on a card}
  - {fg: primary, bg: paper, kind: ui, level: aa, use: Accent fill on the page}
  - {fg: folder-back, bg: paper, kind: ui, level: aa, use: The mark's folder back on the page}
  - {fg: on-primary, bg: folder-back, kind: ui, level: aa, use: The check if it overlaps the folder back}

cvd:
  groups: [[primary, ink]]
  min_delta_e: 10

# One OFL family for the sibling tools, so they look related. Self-hosted, Latin and Cyrillic.
fonts:
  display:
    family: Inter
    fallback: [system-ui, Segoe UI, Roboto, Noto Sans, DejaVu Sans, sans-serif]
    license: OFL-1.1
    license_file: fonts/OFL-Inter.txt
    files:
      - {path: fonts/Inter-latin-700.woff2, weight: 700, style: normal, unicode_range: "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"}
      - {path: fonts/Inter-cyrillic-700.woff2, weight: 700, style: normal, unicode_range: "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"}
    note: Headings and the wordmark.
  body:
    family: Inter
    fallback: [system-ui, Segoe UI, Roboto, Noto Sans, DejaVu Sans, sans-serif]
    license: OFL-1.1
    license_file: fonts/OFL-Inter.txt
    files:
      - {path: fonts/Inter-latin-400.woff2, weight: 400, style: normal, unicode_range: "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"}
      - {path: fonts/Inter-cyrillic-400.woff2, weight: 400, style: normal, unicode_range: "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"}
    note: Running text.

assets:
  - {id: mark, form: mark, path: logo-mark.svg, mono: false, label: {uk: Знак, en: Mark}}
  - {id: small-mark, form: small-mark, path: favicon.svg, mono: false, label: {uk: Малий знак (16-32 px), en: Small mark (16 to 32 px)}}
  # The still mark with ids on its parts; `build` writes generated/animated-mark.svg (the check is drawn in, then the
  # sheet settles). Reduced motion shows the still frame.
  - id: animated-mark
    form: animated
    path: logo-mark.svg
    mono: false
    note: {uk: "README і сторінка проєкту", en: "README and the project page"}
    label: {uk: Анімований знак (галочка), en: Animated mark (the check)}
    animation:
      duration: 1.6
      replay: [hover, focus]
      parts:
        - {target: "#sheet", preset: fade, start: 0, duration: 0.5}
        - {target: "#check", preset: draw-in, start: 0.4, duration: 0.9}
  - {id: mono-mark, form: mono, path: logo-mark-mono.svg, label: {uk: Один колір, en: One colour}}
  - {id: lockup, form: lockup, path: logo-full.svg, mono: false, label: {uk: Лого з написом (укр), en: Lockup (Ukrainian)}}
  - {id: lockup-en, form: lockup, path: logo-full-en.svg, mono: false, label: {uk: Лого з написом (лат), en: Lockup (Latin)}}

budgets:
  svg_bytes: 4096

icons:
  background_role: paper

# The code is MIT (LICENSE); the logo artwork and the name are not: all rights reserved, so a fork picks its own.
legal:
  owner: EvoCASLab
  artwork_license: LicenseRef-All-Rights-Reserved
  license_file: legal/all-rights-reserved.txt
  trademark:
    en: "dossier and the dossier mark are trademarks of EvoCASLab. The code is MIT; the name and the mark are not part of that licence. Do not use them in a way that suggests endorsement. A fork must use another name and mark."
    uk: "dossier і знак dossier є торговельними марками EvoCASLab. Код поширюється за MIT; назва і знак не входять до цієї ліцензії. Не використовуйте їх так, ніби вони підтверджують схвалення. Форк має мати іншу назву і знак."
