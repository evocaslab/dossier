name: dossier
description: Check that a repo carries its dossier; one line per check, fails on a fail or an unknown.
inputs:
  check:
    description: One check name, or empty for all.
    required: false
    default: ""
  root:
    description: Repo root to check.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: dossier check
      shell: bash
      env:
        DOSSIER_CHECK: ${{ inputs.check }}
        DOSSIER_ROOT: ${{ inputs.root }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        args=(check --root "$DOSSIER_ROOT")
        if [ -n "$DOSSIER_CHECK" ]; then args+=("$DOSSIER_CHECK"); fi
        uvx --from "$ACTION_PATH" dossier "${args[@]}"
